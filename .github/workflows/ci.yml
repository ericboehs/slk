name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby-version: ['3.2', '3.3', '3.4', '4.0']
    runs-on: ${{ matrix.os }}
    # A green run finishes in under a minute. Without a bound, a test that
    # blocks instead of failing holds the runner for GitHub's 6-hour default
    # and publishes no log until it does — the failure mode is a job that
    # never reports rather than one that reports a failure.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Install age (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y age

      - name: Install age (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install age

      - name: Run tests
        run: bundle exec rake test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Install age
        run: sudo apt-get install -y age

      - name: Run tests with coverage threshold
        env:
          COVERAGE: '1'
        run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run rubocop
        run: bundle exec rubocop
